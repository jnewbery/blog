{% extends "base.html" %}

{% block title %}#{{ tag }} | {{ SITE_TITLE }}{% endblock %}

{% block content %}
<article>
  <header>
    <h1 class="title">#{{ tag }}</h1>
  </header>
  <div class="index-posts">
    {% for article in articles %}
    <div class="post-teaser">
      <p>
        <span class="meta">{{ article.date.strftime('%Y-%m-%d') }}</span>
        <a class="post-link" href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a>
      </p>
    </div>
    {% endfor %}
  </div>
</article>
{% endblock %}
